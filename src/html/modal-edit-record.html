<!-- ══════════════════════════════════════════════════
     MODALS (unchanged from original)
══════════════════════════════════════════════════ -->

<!-- Edit Record Modal -->
<div id="edit-record-modal" style="display:none;position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:9500;align-items:center;justify-content:center" onclick="if(event.target===this)closeEditRecord()">
  <div style="background:var(--surface);border-radius:16px;padding:1.75rem;width:min(660px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(13,27,42,.25);position:relative">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:12px;border-bottom:2px solid var(--border)">
      <div>
        <div style="font-family:DM Sans,sans-serif;font-size:18px;font-weight:600;color:var(--ink)">Edit Supply Record</div>
        <div style="font-size:12px;color:var(--pg-deliverylog);margin-top:3px">Modify actuals, BDN numbers, status, barge or remarks. Changes sync to all team members.</div>
      </div>
      <button onclick="closeEditRecord()" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pg-deliverylog);line-height:1">&times;</button>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--pg-deliverylog);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">Vessel &amp; Logistics</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px">
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Vessel Name</label><input type="text" id="er-vessel" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Barge</label><input type="text" id="er-barge" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Agent</label><input type="text" id="er-agent" list="agent-directory-list" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">ISO Spec</label><select id="er-spec" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%;background:var(--surface)"><option value="ISO 8217:2010">ISO 8217:2010</option><option value="ISO 8217:2017">ISO 8217:2017</option><option value="">—</option></select></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Supply Date / Start</label><input type="text" id="er-date" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%"></div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--pg-deliverylog);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-top:12px;border-top:1px solid var(--border2)">Quantities (MT)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:18px">
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Nom. VLSFO</label><input type="number" id="er-vlsfo-nom" min="0" step="1" readonly tabindex="-1" title="Nominated quantity — for reference only; reports use the Actual" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--surface2);color:var(--muted)"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--fuel-v);font-weight:700;letter-spacing:.07em;text-transform:uppercase">Actual VLSFO</label><input type="number" id="er-vlsfo-act" min="0" step="1" oninput="updateEditDiff()" style="font-size:14px;padding:9px 12px;border:2px solid var(--fuel-v);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--fuel-v-lt);font-weight:600;color:var(--ink)"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Nom. MGO</label><input type="number" id="er-mgo-nom" min="0" step="1" readonly tabindex="-1" title="Nominated quantity — for reference only; reports use the Actual" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--surface2);color:var(--muted)"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--fuel-m);font-weight:700;letter-spacing:.07em;text-transform:uppercase">Actual LSMGO</label><input type="number" id="er-mgo-act" min="0" step="1" oninput="updateEditDiff()" style="font-size:14px;padding:9px 12px;border:2px solid var(--fuel-m);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--fuel-m-lt);font-weight:600;color:var(--ink)"></div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--pg-deliverylog);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-top:12px;border-top:1px solid var(--border2)">BDN Numbers</div>
    <div class="er-bdn-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px">
      <div style="display:flex;flex-direction:column;gap:5px"><label for="er-bdn-v" style="font-size:10px;color:var(--fuel-v);font-weight:700;letter-spacing:.07em;text-transform:uppercase">BDN No. (VLSFO)</label><input type="text" id="er-bdn-v" maxlength="60" autocomplete="off" spellcheck="false" oninput="updateEditDiff()" placeholder="BDN No." style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--surface);color:var(--text)"></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label for="er-bdn-m" style="font-size:10px;color:var(--fuel-m);font-weight:700;letter-spacing:.07em;text-transform:uppercase">BDN No. (LSMGO)</label><input type="text" id="er-bdn-m" maxlength="60" autocomplete="off" spellcheck="false" oninput="updateEditDiff()" placeholder="BDN No." style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Mono,monospace;outline:none;width:100%;background:var(--surface);color:var(--text)"></div>
    </div>
    <div style="font-size:10px;font-weight:700;color:var(--pg-deliverylog);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;padding-top:12px;border-top:1px solid var(--border2)">Status &amp; Remarks</div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:18px">
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Supply Status</label><select id="er-supplied" onchange="updateEditDiff()" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%;background:var(--surface)"><option value="yes">Completed</option><option value="no">Pending</option></select></div>
      <div style="display:flex;flex-direction:column;gap:5px"><label style="font-size:10px;color:var(--pg-deliverylog);font-weight:600;letter-spacing:.07em;text-transform:uppercase">Remarks / Notes</label><input type="text" id="er-notes" style="font-size:13px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:DM Sans,sans-serif;outline:none;width:100%"></div>
    </div>
    <div id="er-diff" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:12px;color:var(--pg-deliverylog);margin-bottom:18px;display:none">
      <div style="font-size:10px;font-weight:700;color:var(--pg-deliverylog);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">Change Summary</div>
      <div id="er-diff-rows" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--border2)">
      <button onclick="closeEditRecord()" style="padding:10px 20px;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:DM Sans,sans-serif;color:var(--pg-deliverylog)">Cancel</button>
      <button onclick="saveEditRecord()" style="padding:10px 28px;background:linear-gradient(135deg,var(--ink-solid),var(--fuel-v));color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:DM Sans,sans-serif;box-shadow:0 4px 14px rgba(26,111,212,.3)">Save Changes</button>
    </div>
  </div>
</div>
