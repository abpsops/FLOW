<!-- ══════════════════════════════════════════════════
     PAGE: CHECKLIST
══════════════════════════════════════════════════ -->
<div class="page" id="page-checklist" data-section="reports">
  <div class="page-header-row">
    <div>
      <div class="page-title">Supply Operations Checklist</div>
      <div class="page-subtitle">Enter the actuals and press Save — saving logs the supply and completes the row</div>
    </div>
    <div class="page-actions">
      <!-- Clear Checklist moved to the sidebar Data Management (typed confirmation) -->
      <button class="btn btn-secondary btn-sm" onclick="downloadChecklist()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Checklist
      </button>
      <button class="btn btn-success btn-sm" onclick="openMonthlyReport()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Monthly Report
      </button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <div id="checklist-rows"></div>
  </div>

  <div class="sec-hdr" style="margin-top:1.5rem">
    <span class="sec-label">Remaining Supply Tracker</span>
    <div style="display:flex;gap:8px">
      <button onclick="downloadRemainingSupplyTrackerPNG()" id="rst-download-btn" class="btn btn-ghost btn-sm" style="display:flex;align-items:center;gap:6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download as Image
      </button>
      <button onclick="downloadRemainingSupplyTrackerPDF()" id="rst-download-pdf-btn" class="btn btn-ghost btn-sm" style="display:flex;align-items:center;gap:6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="12" y2="11"/></svg>
        Download as PDF
      </button>
      <button onclick="renderRemainingSupplyTracker()" class="btn btn-ghost btn-sm">Refresh</button>
    </div>
  </div>
  <div class="card" style="padding:0;overflow:hidden" id="remaining-tracker-card">
    <div id="remaining-supply-tracker" style="padding:12px">
      <div style="font-size:12px;color:var(--muted);padding:8px;text-align:center">Generate schedule first, then save supply records here to track remaining quantities.</div>
    </div>
  </div>
</div>
