<!-- ══════════════════════════════════════════════════
     PAGE: TRASH BIN
══════════════════════════════════════════════════ -->
<div class="page" id="page-trash" data-section="system">
  <div class="page-header-row">
    <div>
      <div class="page-title">Trash Bin</div>
      <div class="page-subtitle">Removed vessels — restore or permanently delete</div>
    </div>
    <div class="page-actions">
      <button class="btn btn-danger btn-sm" onclick="clearTrashBin()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        Empty Trash
      </button>
    </div>
  </div>
  <div id="trash-bin-section">
    <div id="trash-bin-list">
      <div style="font-size:12px;color:var(--muted);text-align:center;padding:32px;background:var(--surface);box-shadow:var(--sh-in-xs);border-radius:var(--radius)">Trash bin is empty.</div>
    </div>
  </div>
</div>
