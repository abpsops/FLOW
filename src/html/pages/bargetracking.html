<!-- ══════════════════════════════════════════════════
     PAGE: BARGE TRACKING REPORTS
     Upload a PDF tracking report for a date range. It's stored in
     Supabase Storage (not embedded in the synced JSON state — PDFs are
     too big for that) and the small metadata record (dates, filename,
     who/when) syncs through the normal shared-state mechanism, so it
     shows up for every operator AND trader within the usual ~30s
     auto-sync poll, with a banner alerting them a new one landed.
══════════════════════════════════════════════════ -->
<div class="page" id="page-bargetracking" data-section="reports">
  <div class="page-header-row">
    <div>
      <div class="page-title">Barge Tracking Reports</div>
      <div class="page-subtitle">Every operator and trader can view and download — only operators upload or remove reports</div>
    </div>
  </div>

  <div id="btr-upload-card" style="background:var(--surface);border-radius:var(--radius);padding:1.25rem 1.5rem;box-shadow:var(--sh-sm);margin-bottom:16px">
    <div class="g2" style="margin-bottom:14px">
      <div class="field"><label for="btr-from">From Date</label>
        <div class="input-with-cal">
          <input type="text" id="btr-from" placeholder="01 Jan 2026" autocomplete="off">
          <button type="button" class="cal-btn" onclick="openBtrFromPicker()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
        </div>
      </div>
      <div class="field"><label for="btr-to">To Date</label>
        <div class="input-with-cal">
          <input type="text" id="btr-to" placeholder="31 Jan 2026" autocomplete="off">
          <button type="button" class="cal-btn" onclick="openBtrToPicker()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
        </div>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px">
      <label for="btr-file">Report (PDF)</label>
      <input type="file" id="btr-file" accept="application/pdf,.pdf">
    </div>
    <button class="btn btn-primary" id="btr-upload-btn" onclick="uploadBargeTrackingReport()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:-2px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Report
    </button>
  </div>
  <div id="btr-upload-locked" style="display:none;background:var(--surface2);border-radius:var(--radius);padding:14px 1.5rem;box-shadow:var(--sh-sm);margin-bottom:16px;font-size:12px;color:var(--muted);align-items:center;gap:8px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Only operators can upload or remove reports here — you can still open and download any report below.
  </div>

  <div style="background:var(--surface);border-radius:var(--radius);padding:1.25rem 1.5rem;box-shadow:var(--sh-sm)">
    <div id="btr-list"></div>
  </div>
</div>
