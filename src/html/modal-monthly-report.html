<!-- Monthly Report Modal -->
<div id="monthly-modal" style="display:none;position:fixed;inset:0;background:rgba(13,27,42,.45);backdrop-filter:blur(4px);z-index:9000;align-items:center;justify-content:center">
      <div style="background:var(--surface);border-radius:14px;padding:1.75rem;width:min(580px,95vw);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);position:relative">
        <div style="font-family:DM Sans,sans-serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:1rem"> Monthly Supply Report</div>
        <div style="display:flex;gap:0;border:none;box-shadow:var(--sh-in-xs);border-radius:8px;overflow:hidden;margin-bottom:14px">
          <button id="mode-month-btn" onclick="setReportMode('month')" style="flex:1;padding:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:DM Sans,sans-serif;background:var(--azure);color:#fff">By Month</button>
          <button id="mode-range-btn" onclick="setReportMode('range')" style="flex:1;padding:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:DM Sans,sans-serif;background:var(--surface);color:var(--sub)">By Date Range</button>
        </div>
        <div id="report-mode-month">
          <div class="g2" style="margin-bottom:14px">
            <div class="field"><label>Month</label>
              <select id="report-month">
                <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                <option value="3">April</option><option value="4">May</option><option value="5">June</option>
                <option value="6">July</option><option value="7">August</option><option value="8">September</option>
                <option value="9">October</option><option value="10">November</option><option value="11">December</option>
              </select>
            </div>
            <div class="field"><label>Year</label><input type="number" id="report-year" value="2026" min="2026" max="2099"></div>
          </div>
        </div>
        <div id="report-mode-range" style="display:none">
          <div class="g2" style="margin-bottom:14px">
            <div class="field"><label>From Date</label>
              <div class="input-with-cal">
                <input type="text" id="report-from" placeholder="01 Jan 2026" autocomplete="off">
                <button type="button" class="cal-btn" onclick="openReportFromPicker()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
              </div>
            </div>
            <div class="field"><label>To Date</label>
              <div class="input-with-cal">
                <input type="text" id="report-to" placeholder="31 Jan 2026" autocomplete="off">
                <button type="button" class="cal-btn" onclick="openReportToPicker()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
              </div>
            </div>
          </div>
        </div>
        <div class="field" style="margin-bottom:14px">
          <label>Port</label>
          <div style="display:flex;gap:0;border:none;box-shadow:var(--sh-in-xs);border-radius:8px;overflow:hidden">
            <button id="report-port-all" onclick="setReportPort('ALL')" style="flex:1;padding:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:DM Sans,sans-serif;background:var(--azure);color:#fff">All Ports</button>
            <button id="report-port-fuj" onclick="setReportPort('FUJ')" style="flex:1;padding:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:DM Sans,sans-serif;background:var(--surface);color:var(--sub)">FUJ Only</button>
            <button id="report-port-kfk" onclick="setReportPort('KFK')" style="flex:1;padding:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:DM Sans,sans-serif;background:var(--surface);color:var(--sub)">KFK Only</button>
          </div>
        </div>
        <div id="monthly-preview" style="margin-bottom:14px"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="mr-excel-btn" class="btn-nsc" onclick="downloadMonthlyReport(this)">⬇ Download Excel</button>
          <button id="mr-pdf-btn" class="btn-nsc" onclick="downloadMonthlyReportPDF(this)">⬇ Download PDF</button>
          <button class="btn-success" onclick="_archiveCurrentReport()" style="font-size:12px">Archive Month</button>
          <button class="btn-ghost" onclick="closeMonthlyReport()">Close</button>
        </div>
      </div>
    </div>
