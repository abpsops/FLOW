    <!-- A real <form> so Enter submits and password managers recognise the
         login; novalidate keeps the handler's own error messages. -->
    <form id="og-card" onsubmit="_handleOperatorLogin(event)" novalidate>
      <div style="margin-bottom:18px">
        <label class="og-label" for="og-email">Email</label>
        <input type="email" id="og-email" class="og-input" autocomplete="username" placeholder="operator@company.com" required>
      </div>
      <div style="margin-bottom:20px">
        <label class="og-label" for="og-password">Password</label>
        <div style="position:relative">
          <input type="password" id="og-password" class="og-input" autocomplete="current-password"
            placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required
            style="padding-right:38px">
          <button type="button" onclick="_toggleOgPassword()" id="og-pw-toggle" aria-label="Show or hide password">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="og-error"></div>
      <button id="og-submit-btn" type="submit">Sign In</button>
    </form>

    <div id="og-footer-hint">All operators share one live workspace — changes sync instantly.</div>
  </div>

  </div>
